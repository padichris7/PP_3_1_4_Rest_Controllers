<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table thead th {
            border-bottom: 2px solid #dee2e6;
            font-size: 0.85rem;
        }
        .table th,
        .table td {
            vertical-align: middle;
            text-align: left;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-normal d-flex align-items-center gap-2">
            <strong id="currentUserEmail" class="ms-2" style="font-size: 0.9em; line-height: 1; display: block;"></strong>
            <span class="ms-2 me-2">with roles:</span>
            <span id="currentUserRoles" style="text-transform: uppercase; letter-spacing: 1px; margin-right: 4px;"></span>
        </span>
        <button type="button" id="logoutBtn" class="btn btn-sm" style="color: rgba(255, 255, 255, 0.6); background: transparent; border: none; padding: 0.25rem 0.5rem;">Logout</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <nav class="col-md-2 d-none d-md-block bg-dark sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link active text-white bg-primary" aria-current="page" th:href="@{/admin}">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user}">User</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4">

            <div class="pt-3 pb-2">
                <h1 class="display-5 fw-semibold">Admin panel</h1>
            </div>

            <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users-pane" type="button" role="tab">Users table</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="new-user-tab" data-bs-toggle="tab" data-bs-target="#new-user-pane" type="button" role="tab">New User</button>
                </li>
            </ul>

            <div class="tab-content" id="adminTabsContent">

                <div class="tab-pane fade show active" id="users-pane" role="tabpanel">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h4 class="mb-0">All users</h4>
                        </div>
                        <div class="card-body p-3">
                            <div class="table-responsive">
                                <table class="table align-middle mb-0" id="usersTable">
                                    <thead>
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">First Name</th>
                                        <th scope="col">Last Name</th>
                                        <th scope="col">Age</th>
                                        <th scope="col">Email</th>
                                        <th scope="col">Role</th>
                                        <th scope="col">Edit</th>
                                        <th scope="col">Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody id="usersTableBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="new-user-pane" role="tabpanel">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h4 class="mb-0">Add new user</h4>
                        </div>
                        <form id="addUserForm" class="row g-1" style="max-width: 600px; margin: 0 auto; padding: 20px;">
                            <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                                <label for="username" class="form-label fw-bold" style="margin-bottom: 2px;">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Username" style="height: 35px; padding: 0 0 0 10px;" required>
                            </div>
                            <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                                <label for="firstName" class="form-label fw-bold" style="margin-bottom: 2px;">First name</label>
                                <input type="text" class="form-control" id="firstName" placeholder="First name" style="height: 35px; padding: 0 0 0 10px;">
                            </div>
                            <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                                <label for="lastName" class="form-label fw-bold" style="margin-bottom: 2px;">Last name</label>
                                <input type="text" class="form-control" id="lastName" placeholder="Last name" style="height: 35px; padding: 0 0 0 10px;">
                            </div>
                            <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                                <label for="age" class="form-label fw-bold" style="margin-bottom: 2px;">Age</label>
                                <input type="number" class="form-control" id="age" placeholder="Age" style="height: 35px; padding: 0 0 0 10px;" min="0" max="120" step="1">
                            </div>
                            <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                                <label for="email" class="form-label fw-bold" style="margin-bottom: 2px;">Email</label>
                                <input type="text" class="form-control" id="email" placeholder="Email" style="height: 35px; padding: 0 0 0 10px;">
                            </div>
                            <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                                <label for="password" class="form-label fw-bold" style="margin-bottom: 2px;">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Password" style="height: 35px; padding: 0 0 0 10px;">
                            </div>
                            <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                                <label class="form-label fw-bold d-block" style="margin-bottom: 4px;">Role</label>
                                <div id="rolesContainer"></div>
                            </div>
                            <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                                <button type="submit" class="btn btn-primary" style="background-color: #28a745; color: white; padding: 12px 30px; border-radius: 8px; font-weight: 500; border: none;">Add new user</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="editUserModalLabel">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editUserId">
                <div class="modal-body">
                    <div class="mb-3 text-center">
                        <label for="editUsername" class="form-label fw-bold" style="margin-bottom: 4px;">Username</label>
                        <input type="text" id="editUsername" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="editFirstName" class="form-label fw-bold" style="margin-bottom: 4px;">First name</label>
                        <input type="text" id="editFirstName" name="firstName" class="form-control">
                    </div>
                    <div class="mb-3 text-center">
                        <label for="editLastName" class="form-label fw-bold" style="margin-bottom: 4px;">Last name</label>
                        <input type="text" id="editLastName" name="lastName" class="form-control">
                    </div>
                    <div class="mb-3 text-center">
                        <label for="editAge" class="form-label fw-bold" style="margin-bottom: 4px;">Age</label>
                        <input type="number" id="editAge" name="age" class="form-control" min="0" max="120">
                    </div>
                    <div class="mb-3 text-center">
                        <label for="editEmail" class="form-label fw-bold" style="margin-bottom: 4px;">Email</label>
                        <input type="email" id="editEmail" name="email" class="form-control">
                    </div>
                    <div class="mb-3 text-center">
                        <label for="editPassword" class="form-label fw-bold" style="margin-bottom: 4px;">Password</label>
                        <input type="password" id="editPassword" name="password" class="form-control" placeholder="Enter a new password (leave empty to keep current)">
                    </div>
                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold d-block" style="margin-bottom: 4px;">Roles</label>
                        <div id="editRolesContainer"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="deleteUserModalLabel">Delete user</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="deleteForm">
                <input type="hidden" id="deleteUserId">
                <div class="modal-body">
                    <div class="mb-3 text-center">
                        <label for="deleteUsername" class="form-label fw-bold" style="margin-bottom: 4px;">Username</label>
                        <input type="text" id="deleteUsername" class="form-control" disabled>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteFirstName" class="form-label fw-bold" style="margin-bottom: 4px;">First name</label>
                        <input type="text" id="deleteFirstName" class="form-control" disabled>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteLastName" class="form-label fw-bold" style="margin-bottom: 4px;">Last name</label>
                        <input type="text" id="deleteLastName" class="form-control" disabled>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteAge" class="form-label fw-bold" style="margin-bottom: 4px;">Age</label>
                        <input type="number" id="deleteAge" class="form-control" disabled>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deleteEmail" class="form-label fw-bold" style="margin-bottom: 4px;">Email</label>
                        <input type="email" id="deleteEmail" class="form-control" disabled>
                    </div>
                    <div class="mb-3 text-center">
                        <label for="deletePassword" class="form-label fw-bold" style="margin-bottom: 4px;">Password</label>
                        <input type="password" id="deletePassword" class="form-control" placeholder="Password is hidden" disabled>
                    </div>
                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold d-block" style="margin-bottom: 4px;">Roles</label>
                        <div id="deleteRolesContainer"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    let allRoles = [];
    let currentUser = null;

    function getCsrfToken() {
        const name = 'XSRF-TOKEN=';
        const decodedCookie = decodeURIComponent(document.cookie);
        const ca = decodedCookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) === 0) {
                return c.substring(name.length, c.length);
            }
        }
        return '';
    }

    $.ajaxSetup({
        beforeSend: function(xhr) {
            const token = getCsrfToken();
            if (token) {
                xhr.setRequestHeader('X-XSRF-TOKEN', token);
            }
        }
    });

    $(document).ready(function() {
        loadCurrentUser();
        loadRoles().done(function() {
            loadUsers();
        });
    });

    function loadCurrentUser() {
        return $.ajax({
            url: '/api/users/me',
            method: 'GET'
        }).done(function(data) {
            currentUser = data;
            $('#currentUserEmail').text(data.email);
            const roles = data.roles.map(r => r.name.replace('ROLE_', '')).join(', ');
            $('#currentUserRoles').text(roles);
        }).fail(function() {
            console.error('Failed to load current user');
        });
    }

    function loadRoles() {
        return $.ajax({
            url: '/api/users/roles',
            method: 'GET'
        }).done(function(data) {
            allRoles = data;
            renderRoleCheckboxes('rolesContainer', allRoles, 'role-');
            renderRoleCheckboxes('editRolesContainer', allRoles, 'edit-role-', true);
            renderRoleCheckboxes('deleteRolesContainer', allRoles, 'delete-role-', false, true);
        }).fail(function() {
            console.error('Failed to load roles');
        });
    }

    function renderRoleCheckboxes(containerId, roles, idPrefix, forEdit = false, disabled = false) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        roles.forEach(role => {
            const div = document.createElement('div');
            div.className = 'form-check form-check-inline';
            const checkbox = document.createElement('input');
            checkbox.className = 'form-check-input';
            checkbox.type = 'checkbox';
            checkbox.id = idPrefix + role.id;
            checkbox.value = role.id.toString();
            if (disabled) checkbox.disabled = true;
            if (forEdit) checkbox.classList.add('edit-role-checkbox');
            else if (containerId === 'deleteRolesContainer') checkbox.classList.add('delete-role-checkbox');

            const label = document.createElement('label');
            label.className = 'form-check-label';
            label.htmlFor = idPrefix + role.id;
            label.textContent = role.name;

            div.appendChild(checkbox);
            div.appendChild(label);
            container.appendChild(div);
        });
    }

    function loadUsers() {
        $.ajax({
            url: '/api/users',
            method: 'GET'
        }).done(function(data) {
            renderUsersTable(data);
        }).fail(function() {
            $('#usersTableBody').html('<tr><td colspan="8" class="text-center">Failed to load users</td></tr>');
        });
    }

    function renderUsersTable(users) {
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';

        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">There are no users</td></tr>';
            return;
        }

        users.forEach(user => {
            const tr = document.createElement('tr');
            if (currentUser && user.username === currentUser.username) {
                tr.classList.add('table-active');
            }

            const rolesHtml = user.roles.map(r => `<span class="badge bg-secondary me-1">${r.name}</span>`).join('');
            const roleIds = user.roles.map(r => r.id).join(',');

            tr.innerHTML = `
                <td>${user.id}</td>
                <td>${user.firstName || ''}</td>
                <td>${user.lastName || ''}</td>
                <td>${user.age != null ? user.age : ''}</td>
                <td>${user.email || ''}</td>
                <td>${rolesHtml}</td>
                <td>
                    <button type="button" class="btn btn-sm btn-info text-white edit-btn"
                            data-id="${user.id}"
                            data-username="${user.username}"
                            data-first-name="${user.firstName || ''}"
                            data-last-name="${user.lastName || ''}"
                            data-age="${user.age != null ? user.age : ''}"
                            data-email="${user.email || ''}"
                            data-roles="${roleIds}">
                        Edit
                    </button>
                </td>
                <td>
                    <button type="button" class="btn btn-sm btn-danger delete-btn"
                            data-id="${user.id}"
                            data-username="${user.username}"
                            data-first-name="${user.firstName || ''}"
                            data-last-name="${user.lastName || ''}"
                            data-age="${user.age != null ? user.age : ''}"
                            data-email="${user.email || ''}"
                            data-roles="${roleIds}">
                        Delete
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Вешаем обработчики ПОСЛЕ рендера таблицы
        $(document).off('click', '.edit-btn');
        $(document).off('click', '.delete-btn');

        $(document).on('click', '.edit-btn', function() {
            openEditModal($(this));
        });

        $(document).on('click', '.delete-btn', function() {
            openDeleteModal($(this));
        });
    }

    function openEditModal(btn) {
        const id = btn.data('id');
        $('#editUserId').val(id);
        $('#editUsername').val(btn.data('username'));
        $('#editFirstName').val(btn.data('first-name'));
        $('#editLastName').val(btn.data('last-name'));
        $('#editAge').val(btn.data('age'));
        $('#editEmail').val(btn.data('email'));
        $('#editPassword').val('');

        const selectedRoleIds = btn.data('roles').toString().split(',');
        $('.edit-role-checkbox').each(function() {
            $(this).prop('checked', selectedRoleIds.includes($(this).val()));
        });

        const editModal = new bootstrap.Modal(document.getElementById('editUserModal'));
        editModal.show();
    }

    function openDeleteModal(btn) {
        const id = btn.data('id');
        $('#deleteUserId').val(id);
        $('#deleteUsername').val(btn.data('username'));
        $('#deleteFirstName').val(btn.data('first-name'));
        $('#deleteLastName').val(btn.data('last-name'));
        $('#deleteAge').val(btn.data('age'));
        $('#deleteEmail').val(btn.data('email'));
        $('#deletePassword').val('');

        const selectedRoleIds = btn.data('roles').toString().split(',');
        $('.delete-role-checkbox').each(function() {
            $(this).prop('checked', selectedRoleIds.includes($(this).val()));
        });

        const deleteModal = new bootstrap.Modal(document.getElementById('deleteUserModal'));
        deleteModal.show();
    }

    $('#addUserForm').on('submit', function(e) {
        e.preventDefault();

        const selectedRoleIds = [];
        $('#rolesContainer input[type="checkbox"]:checked').each(function() {
            selectedRoleIds.push(parseInt($(this).val()));
        });

        const userData = {
            username: $('#username').val(),
            firstName: $('#firstName').val(),
            lastName: $('#lastName').val(),
            age: $('#age').val() ? parseInt($('#age').val()) : null,
            email: $('#email').val(),
            password: $('#password').val(),
            roles: selectedRoleIds.map(id => ({ id: id }))
        };

        $.ajax({
            url: '/api/users',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(userData),
            success: function() {
                alert('User added successfully!');
                document.getElementById('addUserForm').reset();
                $('#rolesContainer input[type="checkbox"]').prop('checked', false);
                loadUsers();
                $('#users-tab').tab('show');
            },
            error: function(xhr) {
                alert('Error adding user: ' + (xhr.responseJSON?.message || xhr.statusText));
            }
        });
    });

    $('#editForm').on('submit', function(e) {
        e.preventDefault();

        const id = $('#editUserId').val();
        const selectedRoleIds = [];
        $('.edit-role-checkbox:checked').each(function() {
            selectedRoleIds.push(parseInt($(this).val()));
        });

        const userData = {
            username: $('#editUsername').val(),
            firstName: $('#editFirstName').val(),
            lastName: $('#editLastName').val(),
            age: $('#editAge').val() ? parseInt($('#editAge').val()) : null,
            email: $('#editEmail').val(),
            roles: selectedRoleIds.map(roleId => ({ id: roleId }))
        };

        const password = $('#editPassword').val();
        if (password && password.trim() !== '') {
            userData.password = password;
        }

        $.ajax({
            url: '/api/users/' + id,
            method: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(userData),
            success: function() {
                alert('User updated successfully!');
                loadUsers();
                bootstrap.Modal.getInstance(document.getElementById('editUserModal')).hide();
            },
            error: function(xhr) {
                alert('Error updating user: ' + (xhr.responseJSON?.message || xhr.statusText));
            }
        });
    });

    $('#deleteForm').on('submit', function(e) {
        e.preventDefault();

        const id = $('#deleteUserId').val();

        $.ajax({
            url: '/api/users/' + id,
            method: 'DELETE',
            success: function() {
                alert('User deleted successfully!');
                loadUsers();
                bootstrap.Modal.getInstance(document.getElementById('deleteUserModal')).hide();
            },
            error: function(xhr) {
                alert('Error deleting user: ' + (xhr.responseJSON?.message || xhr.statusText));
            }
        });
    });

    $('#logoutBtn').on('click', function() {
        $.ajax({
            url: '/logout',
            method: 'POST',
            success: function() {
                window.location.href = '/login';
            },
            error: function() {
                window.location.href = '/login';
            }
        });
    });
</script>

</body>
</html>
